<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Handling Practice</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Error Handling Practice API</h1>
      <p>Use Postman to interact with the API endpoints below.</p>
      <ul>
        <li><code>GET /users</code> — list all users</li>
        <li><code>GET /users/:id</code> — get a user by ID</li>
        <li><code>POST /users</code> — create a user</li>
        <li><code>GET /posts</code> — list all posts</li>
        <li><code>POST /posts</code> — create a post</li>
      </ul>
    </main>
  </body>
</html>
